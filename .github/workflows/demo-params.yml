name: Demo Workflow with Single Parameter

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        type: choice
        default: 'staging'
        options:
          - development
          - staging
          - production
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

jobs:
  demo:
    name: Demo Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print parameter
        run: |
          echo "=========================================="
          echo "Event: ${{ github.event_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Selected environment: ${{ inputs.environment || 'staging' }}"
          echo "=========================================="

      - name: Execute demo task
        run: |
          TARGET_ENV="${{ inputs.environment || 'staging' }}"
          echo "Starting demo task for target environment: $TARGET_ENV"
          sleep 2
          echo "Demo task finished successfully for $TARGET_ENV!"

      - name: Generate step summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🚀 Execution Summary

          | Parameter | Value |
          |:---|:---|
          | **Event** | `${{ github.event_name }}` |
          | **Environment** | `${{ inputs.environment || 'staging' }}` |
          | **Triggered By** | `@${{ github.actor }}` |
          | **Status** | Completed Successfully ✅ |
          EOF
